<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết bài tập - Lê Kế Đức</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] text-[#1e293b] flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white/40 backdrop-blur-2xl sticky top-0 z-50 border-b border-white/50 shadow-[0_4px_30px_rgba(0,0,0,0.05)] shadow-[inset_0_-1px_0_rgba(255,255,255,0.5)]">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-[#0f4c81] text-lg">Chi tiết chương học</span>
            </div>
            <a href="LeKeDucPortfolio.html#cac-chuong-hoc" class="text-sm font-medium text-gray-600 hover:text-[#0f4c81] flex items-center space-x-1 transition bg-gray-50 px-4 py-2 rounded-lg border border-gray-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                <span>Quay lại Portfolio</span>
            </a>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-1 flex flex-col w-full" data-aos="fade-in" data-aos-duration="1000">
        <!-- Top Section: Overview & Summary -->
        <div class="bg-white border-b border-gray-200 w-full z-10 relative">
            <div class="max-w-5xl mx-auto px-6 py-6 md:py-8">
                <div class="flex flex-col md:flex-row gap-6 md:gap-8">
                    <!-- Tiêu đề & Overview -->
                    <div class="flex-1">
                        <span class="text-[10px] uppercase font-bold tracking-wider text-blue-500 block mb-1">Nội dung học phần</span>
                        <h1 id="pageTitle" class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">Đang tải...</h1>
                        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Tổng quan (Overview)</h4>
                        <p id="pageOverview" class="text-sm text-gray-600 leading-relaxed text-justify mb-0">
                            Đang tải tổng quan...
                        </p>
                    </div>
                    <!-- Tóm tắt -->
                    <div class="w-full md:w-1/3 flex-shrink-0">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Tóm tắt bài tập</h4>
                        <div id="pageSummary" class="text-sm text-gray-600 leading-relaxed bg-blue-50/50 p-4 rounded-xl border border-blue-100/50">
                            Đang tải tóm tắt...
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Section: PDF Viewer -->
        <div class="flex-1 bg-gray-50 w-full pb-12 pt-8">
            <div class="max-w-5xl mx-auto px-6 w-full h-[800px] flex flex-col">
                <div class="flex-1 flex flex-col bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
                    <div class="w-full p-2.5 bg-slate-800 text-xs text-slate-200 text-center font-medium flex justify-center items-center space-x-2 flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        <span id="pdfStatus">Trình xem tài liệu PDF</span>
                    </div>
                    <iframe id="pdfViewer" src="" class="flex-1 w-full h-full border-none bg-gray-100" title="PDF Viewer"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // Dữ liệu các chương
        const chapterData = {
            1: {
                title: "Chapter 01: Máy tính và thiết bị ngoại vi",
                overview: "Chương này tập trung vào việc tìm hiểu các thành phần cơ bản của máy tính, hệ điều hành và cách thao tác với tập tin, thư mục để quản lý hệ thống hiệu quả.",
                summary: "<ul class='space-y-2'><li>👉 Tìm hiểu chức năng phần cứng</li><li>👉 Quản lý tập tin cơ bản</li><li>👉 Thực hành cấu hình hệ điều hành</li></ul>",
                pdf: "Tuan1.pdf"
            },
            2: {
                title: "Chapter 02: Khai thác dữ liệu và thông tin",
                overview: "Hướng dẫn cách tìm kiếm, đánh giá và tổng hợp thông tin từ các nguồn học thuật uy tín trên Internet một cách có chọn lọc và an toàn.",
                summary: "<ul class='space-y-2'><li>👉 Kỹ năng tìm kiếm nâng cao (Google Dorks)</li><li>👉 Phân biệt nguồn tin tin cậy</li><li>👉 Tổng hợp tài liệu phục vụ nghiên cứu</li></ul>",
                pdf: "Tuan2.pdf"
            },
            3: {
                title: "Chapter 03: Tổng quan về trí tuệ nhân tạo",
                overview: "Cung cấp kiến thức nền tảng về AI, cách AI hoạt động và làm thế nào để tận dụng các mô hình ngôn ngữ lớn (LLM) để tối ưu hóa công việc.",
                summary: "<ul class='space-y-2'><li>👉 Tìm hiểu lịch sử và các loại AI</li><li>👉 Nguyên tắc viết Prompt hiệu quả</li><li>👉 Ứng dụng AI vào học tập</li></ul>",
                pdf: "Tuan3.pdf"
            },
            4: {
                title: "Chapter 04: Giao tiếp và hợp tác trực tuyến",
                overview: "Chương này hướng dẫn sử dụng các công cụ đám mây và kỹ năng làm việc nhóm trực tuyến để tăng cường hiệu suất giao tiếp trong môi trường số.",
                summary: "<ul class='space-y-2'><li>👉 Sử dụng Google Workspace / Office 365</li><li>👉 Quản lý dự án nhóm</li><li>👉 Giao tiếp chuyên nghiệp qua Email/Chat</li></ul>",
                pdf: "Tuan4.pdf"
            },
            5: {
                title: "Chapter 05: Sáng tạo nội dung số với AI",
                overview: "Khám phá cách sử dụng AI để sáng tạo các nội dung đa phương tiện như văn bản, hình ảnh, âm thanh và video phục vụ cho công việc và học tập.",
                summary: "<ul class='space-y-2'><li>👉 Tạo hình ảnh bằng AI (Midjourney/DALL-E)</li><li>👉 Soạn thảo nội dung sáng tạo</li><li>👉 Tinh chỉnh nội dung tự động</li></ul>",
                pdf: "Tuan5.pdf"
            },
            6: {
                title: "Chapter 06: An toàn và liêm chính học thuật",
                overview: "Phân tích các rủi ro bảo mật trên mạng và nguyên tắc đạo đức khi sử dụng AI, nhấn mạnh việc bảo vệ quyền sở hữu trí tuệ.",
                summary: "<ul class='space-y-2'><li>👉 Bảo mật thông tin cá nhân</li><li>👉 Trích dẫn và phòng chống đạo văn</li><li>👉 Đạo đức AI trong nghiên cứu</li></ul>",
                pdf: "Tuan6.pdf"
            },
            7: {
                title: "Chapter 07: Kỹ năng phát triển tương lai",
                overview: "Tổng hợp các kỹ năng đã học để định hình tư duy công nghệ, chuẩn bị hành trang vững chắc cho sự nghiệp số trong tương lai.",
                summary: "<ul class='space-y-2'><li>👉 Xây dựng Portfolio cá nhân</li><li>👉 Định hướng nghề nghiệp số</li><li>👉 Lập kế hoạch phát triển kỹ năng</li></ul>",
                pdf: "Tuan7.pdf"
            }
        };

        // Lấy ID chương từ URL (ví dụ: chapter.html?id=1)
        const urlParams = new URLSearchParams(window.location.search);
        const chapterId = urlParams.get('id');

        if (chapterId && chapterData[chapterId]) {
            const data = chapterData[chapterId];
            document.title = data.title + " - Portfolio";
            document.getElementById('pageTitle').innerText = data.title;
            document.getElementById('pageOverview').innerText = data.overview;
            document.getElementById('pageSummary').innerHTML = data.summary;
            document.getElementById('pdfViewer').src = data.pdf;
            document.getElementById('pdfStatus').innerText = "Đang xem: " + data.pdf;
        } else {
            document.getElementById('pageTitle').innerText = "Không tìm thấy dữ liệu";
            document.getElementById('pageOverview').innerText = "Vui lòng chọn một chương học từ trang chủ Portfolio.";
            document.getElementById('pageSummary').innerHTML = "<span class='text-red-500'>Lỗi truy cập</span>";
        }
    </script>
</body>
</html>
